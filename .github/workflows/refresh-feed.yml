name: Refresh vehicle feed

on:
  schedule:
    # 11:00 UTC is 5:00 AM CST / 6:00 AM CDT
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-vehicle-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: ./run.sh

      - name: Validate feed and stage for Pages
        run: |
          python3 - <<'PY'
          import shutil, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path("out/vehicle_feed.xml")
          tsv_path = Path("out/vehicle_feed.tsv")
          if not xml_path.is_file() or not tsv_path.is_file():
              sys.exit("Build did not write out/vehicle_feed.xml and out/vehicle_feed.tsv")

          try:
              root = ET.parse(xml_path).getroot()
          except ET.ParseError as exc:
              sys.exit(f"vehicle_feed.xml is not valid XML: {exc}")

          items = root.findall(".//item")
          n = len(items)
          print(f"parsed_items={n}")
          if n < 5:
              sys.exit(f"Refusing to publish: only {n} vehicles (need >= 5)")

          ns = "http://base.google.com/ns/1.0"
          missing_lt = []
          for item in items:
              lt = item.findtext(f"{{{ns}}}link_template") or ""
              if "{store_code}" not in lt or not lt.startswith("http"):
                  missing_lt.append(item.findtext(f"{{{ns}}}id") or "?")
          if missing_lt:
              sys.exit(f"Missing or invalid link_template on {len(missing_lt)} items: {', '.join(missing_lt[:5])}")

          docs = Path("docs")
          docs.mkdir(exist_ok=True)
          shutil.copyfile(xml_path, docs / "vehicle_feed.xml")
          shutil.copyfile(tsv_path, docs / "vehicle_feed.tsv")
          (docs / ".nojekyll").touch()
          PY

      - name: Commit and push if the feed changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vehicle_feed.xml docs/vehicle_feed.tsv docs/.nojekyll
          if git diff --staged --quiet; then
            echo "No feed changes to publish"
          else
            git commit -m "Refresh vehicle feed ($(date -u +%Y-%m-%d))"
            git push
          fi
